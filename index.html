<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>23物流2班 | 母亲节快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #FFF5F5 0%, #FFE4E1 50%, #FFF0F5 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 浮动爱心粒子 */
        .heart {
            position: fixed;
            color: rgba(255, 107, 138, 0.3);
            font-size: 20px;
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* 主容器 */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* 标题区 */
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #FF4169;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(255, 65, 105, 0.2);
        }

        .header .subtitle {
            font-size: 16px;
            color: #FF6B8A;
            font-weight: 500;
        }

        .header .date {
            font-size: 14px;
            color: #999;
            margin-top: 8px;
        }

        /* 合照卡片 */
        .photo-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(255, 107, 138, 0.2);
            margin: 20px 0;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(255, 107, 138, 0.3);
        }

        .photo-card::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, #FF6B8A, #FF4169, #FF6B8A);
            border-radius: 23px;
            z-index: -1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .photo-wrapper {
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .photo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-card:hover .photo-wrapper img {
            transform: scale(1.02);
        }

        .photo-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 65, 105, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            animation: bounce 1.5s infinite;
            white-space: nowrap;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        /* 祝福卡片 */
        .blessing-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            max-width: 90%;
            width: 400px;
            position: relative;
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-overlay.active .blessing-card {
            transform: translateY(0);
            opacity: 1;
        }

        .blessing-card::before {
            content: "💌";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .blessing-title {
            text-align: center;
            color: #FF4169;
            font-size: 18px;
            margin-bottom: 20px;
            margin-top: 10px;
            font-weight: 600;
        }

        .blessing-text {
            color: #333;
            font-size: 16px;
            line-height: 1.8;
            text-align: justify;
            min-height: 80px;
        }

        .blessing-text.typing::after {
            content: "|";
            animation: blink 1s infinite;
            color: #FF4169;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 按钮组 */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B8A, #FF4169);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 138, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 底部区域 */
        .footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 20px;
        }

        .teacher-message {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 30px rgba(255, 107, 138, 0.15);
            margin-bottom: 20px;
        }

        .teacher-message h3 {
            color: #FF4169;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .teacher-message p {
            color: #555;
            font-size: 14px;
            line-height: 1.8;
            text-align: left;
        }

        .share-hint {
            background: linear-gradient(135deg, #FF6B8A, #FF4169);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 14px;
            display: inline-block;
            animation: pulse-hint 2s infinite;
        }

        @keyframes pulse-hint {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .class-info {
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        /* 装饰元素 */
        .decoration {
            position: absolute;
            font-size: 24px;
            opacity: 0.3;
            pointer-events: none;
        }

        .decoration-1 { top: 10%; left: 5%; animation: float-dec 6s infinite ease-in-out; }
        .decoration-2 { top: 20%; right: 5%; animation: float-dec 7s infinite ease-in-out 1s; }
        .decoration-3 { bottom: 30%; left: 3%; animation: float-dec 8s infinite ease-in-out 2s; }

        @keyframes float-dec {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .header h1 { font-size: 24px; }
            .blessing-card { padding: 25px 20px; }
            .blessing-text { font-size: 15px; }
        }
    </style>
</head>
<body>
    <!-- 浮动爱心 -->
    <div class="heart" style="left: 10%; animation-delay: 0s;">💕</div>
    <div class="heart" style="left: 25%; animation-delay: 2s;">💖</div>
    <div class="heart" style="left: 40%; animation-delay: 4s;">💗</div>
    <div class="heart" style="left: 55%; animation-delay: 1s;">💕</div>
    <div class="heart" style="left: 70%; animation-delay: 3s;">💖</div>
    <div class="heart" style="left: 85%; animation-delay: 5s;">💗</div>

    <!-- 装饰元素 -->
    <div class="decoration decoration-1">🌸</div>
    <div class="decoration decoration-2">✨</div>
    <div class="decoration decoration-3">🌺</div>

    <div class="container">
        <!-- 标题区 -->
        <div class="header">
            <h1>🌸 母亲节快乐 🌸</h1>
            <div class="subtitle">23物流2班 · 把爱说给妈妈听</div>
            <div class="date">2026年5月10日</div>
        </div>

        <!-- 合照区 -->
        <div class="photo-card" id="photoCard">
            <div class="photo-wrapper">
                <img src="photo.jpg" alt="23物流2班大合照" id="classPhoto">
                <div class="photo-hint">👆 点击照片，收获一份惊喜</div>
            </div>
        </div>

        <!-- 底部区域 -->
        <div class="footer">
            <div class="teacher-message">
                <h3>💌 班主任寄语</h3>
                <p>
                    同学们，感谢你们愿意把对妈妈的爱，写成文字。<br><br>
                    这里有你们说出口的，也有你们平时藏在心里的。<br><br>
                    今天，就让这些话，替你们飞进妈妈心里。<br><br>
                    母亲节快乐，也祝天下所有妈妈，永远被温柔以待。
                </p>
            </div>

            <div class="share-hint">
                📱 长按截图，转发给妈妈
            </div>

            <div class="class-info">
                广东财经大学 · 工商管理学院<br>
                23物流2班 全体同学 敬上
            </div>
        </div>
    </div>

    <!-- 祝福弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="blessing-card">
            <div class="blessing-title">来自同学的心里话</div>
            <div class="blessing-text" id="blessingText"></div>
            <div class="button-group">
                <button class="btn btn-primary" id="nextBtn">💫 换一条</button>
                <button class="btn btn-secondary" id="closeBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 祝福语数据
        const blessings = [
            "你是100分的妈妈！",
            "妈妈，谢谢你一直在背后默默支持我，支持我很多奇奇怪怪的决定，get到我很多行为后面的意思，虽然你不善言辞，默默付出，但是总能让我感觉到满满的爱，我爱你呀妈妈",
            "如果爱有方向，您就是那个坐标。无论我走多远，一回头，您总在那里。您的碎碎念念，温暖了我的岁岁年年。愿时光慢一些，让我能伴您左右，就像小时候您耐心陪我长大一样。",
            "是女性，是母亲，也是强大独立的你自己，你先是自己，然后才是母亲，节日快乐！",
            "希望妈妈永远健康快乐！",
            "妈妈，我爱你"
        ];

        // DOM 元素
        const photoCard = document.getElementById('photoCard');
        const modalOverlay = document.getElementById('modalOverlay');
        const blessingText = document.getElementById('blessingText');
        const nextBtn = document.getElementById('nextBtn');
        const closeBtn = document.getElementById('closeBtn');

        let currentIndex = -1;
        let isTyping = false;

        // 获取随机索引（避免连续重复）
        function getRandomIndex() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * blessings.length);
            } while (newIndex === currentIndex && blessings.length > 1);
            return newIndex;
        }

        // 打字机效果
        function typeWriter(text, element) {
            isTyping = true;
            element.textContent = '';
            element.classList.add('typing');
            
            let i = 0;
            const speed = 50; // 打字速度（毫秒）
            
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove('typing');
                    isTyping = false;
                }
            }
            
            type();
        }

        // 显示祝福
        function showBlessing() {
            currentIndex = getRandomIndex();
            const text = blessings[currentIndex];
            typeWriter(text, blessingText);
        }

        // 打开弹窗
        function openModal() {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            showBlessing();
        }

        // 关闭弹窗
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            // 清除打字机状态
            blessingText.classList.remove('typing');
            isTyping = false;
        }

        // 事件监听
        photoCard.addEventListener('click', openModal);
        
        nextBtn.addEventListener('click', () => {
            if (!isTyping) {
                showBlessing();
            }
        });
        
        closeBtn.addEventListener('click', closeModal);
        
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // 页面加载完成后的欢迎动画
        window.addEventListener('load', () => {
            photoCard.style.opacity = '0';
            photoCard.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                photoCard.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                photoCard.style.opacity = '1';
                photoCard.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
