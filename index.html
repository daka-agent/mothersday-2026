<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 母亲节快乐 | 把爱说给妈妈听</title>

    <!-- Open Graph 分享设置 -->
    <meta property="og:title" content="🌸 母亲节快乐 | 把爱说给妈妈听">
    <meta property="og:description" content="来自23物流2班同学们的妈妈母亲节祝福，把爱说给妈妈听 💌">
    <meta property="og:image" content="https://daka-agent.github.io/mothersday-2026/photo.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://daka-agent.github.io/mothersday-2026/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🌸 母亲节快乐 | 把爱说给妈妈听">
    <meta name="twitter:description" content="来自23物流2班同学们的妈妈母亲节祝福 💌">
    <meta name="twitter:image" content="https://daka-agent.github.io/mothersday-2026/photo.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #FFF5F7 0%, #FFE8EC 30%, #FFD6DC 60%, #FFC4CC 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 花瓣飘落动画 */
        .petal {
            position: fixed;
            width: 12px;
            height: 12px;
            background: radial-gradient(ellipse at center, #FFB6C1 0%, #FF69B4 100%);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.4);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 25px 18px;
            position: relative;
            z-index: 10;
        }

        /* 顶部装饰丝带 */
        .ribbon-top {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .ribbon-top::before {
            content: "❀ ❀ ❁ ❂ ❃";
            font-size: 16px;
            color: #E91E63;
            letter-spacing: 8px;
            opacity: 0.6;
        }

        /* 标题区 */
        .header {
            text-align: center;
            padding: 10px 0 25px;
            position: relative;
        }

        .header .flower-deco {
            font-size: 28px;
            margin-bottom: 8px;
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #E91E63, #FF6B8A, #E91E63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: none;
        }

        .header .subtitle {
            font-size: 15px;
            color: #C2185B;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .header .date-badge {
            display: inline-block;
            margin-top: 12px;
            background: rgba(233, 30, 99, 0.1);
            border: 1px solid rgba(233, 30, 99, 0.2);
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 13px;
            color: #E91E63;
        }

        /* 合照卡片 */
        .photo-section {
            margin: 20px 0;
            position: relative;
        }

        .photo-card {
            background: white;
            border-radius: 24px;
            padding: 12px;
            box-shadow:
                0 8px 32px rgba(233, 30, 99, 0.15),
                0 2px 8px rgba(0, 0, 0, 0.05);
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            overflow: hidden;
        }

        .photo-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #FF6B8A, #E91E63, #FF6B8A, #F48FB1);
            border-radius: 26px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .photo-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow:
                0 12px 48px rgba(233, 30, 99, 0.25),
                0 4px 12px rgba(0, 0, 0, 0.08);
        }

        .photo-wrapper {
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        .photo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }

        .photo-card:hover .photo-wrapper img {
            transform: scale(1.03);
        }

        .photo-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.92), rgba(255, 107, 138, 0.92));
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            animation: hintBounce 2s ease-in-out infinite;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
        }

        @keyframes hintBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* 装饰角花 */
        .photo-card .corner-deco {
            position: absolute;
            width: 40px;
            height: 40px;
            opacity: 0.4;
        }
        .photo-card .corner-deco.tl { top: 8px; left: 8px; }
        .photo-card .corner-deco.tr { top: 8px; right: 8px; transform: scaleX(-1); }
        .photo-card .corner-deco.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
        .photo-card .corner-deco.br { bottom: 8px; right: 8px; transform: scale(-1); }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(80, 0, 20, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 祝福卡片 */
        .blessing-card {
            background: linear-gradient(160deg, #FFF5F7 0%, #FFFFFF 50%, #FFF0F3 100%);
            border-radius: 28px;
            padding: 35px 28px 28px;
            max-width: 92%;
            width: 380px;
            position: relative;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transform: translateY(60px) scale(0.9);
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(233, 30, 99, 0.12);
        }

        .modal-overlay.active .blessing-card {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* 卡片顶部装饰 */
        .card-top-deco {
            text-align: center;
            margin-bottom: 18px;
        }

        .card-top-deco .envelope {
            font-size: 38px;
            display: block;
            animation: envelopeWiggle 2s ease-in-out infinite;
        }

        @keyframes envelopeWiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .card-title {
            text-align: center;
            color: #E91E63;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 22px;
            position: relative;
        }

        .card-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #E91E63, transparent);
            margin: 10px auto 0;
            border-radius: 1px;
        }

        .blessing-text {
            color: #4A1A2C;
            font-size: 16px;
            line-height: 2;
            text-align: justify;
            min-height: 80px;
            padding: 0 5px;
            font-weight: 450;
        }

        .blessing-text.typing::after {
            content: "丨";
            animation: blink 0.8s step-end infinite;
            color: #E91E63;
            font-weight: 300;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 按钮组 */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 13px 0;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #E91E63, #FF6B8A);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #F5F5F5;
            color: #888;
            border: 1px solid #E8E8E8;
        }

        .btn-secondary:hover {
            background: #EBEBEB;
            color: #666;
        }

        /* 底部区域 */
        .footer {
            margin-top: 30px;
            padding: 0 5px;
        }

        .teacher-message {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            padding: 28px 24px;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.1);
            border: 1px solid rgba(233, 30, 99, 0.08);
        }

        .teacher-message h3 {
            color: #E91E63;
            font-size: 17px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 2px;
        }

        .teacher-message p {
            color: #5A3A4A;
            font-size: 14.5px;
            line-height: 2;
            text-align: justify;
        }

        .share-section {
            text-align: center;
            margin-top: 24px;
        }

        .share-hint {
            display: inline-block;
            background: linear-gradient(135deg, #E91E63, #FF6B8A);
            color: white;
            padding: 13px 32px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.35);
            animation: sharePulse 2.5s ease-in-out infinite;
        }

        @keyframes sharePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 20px rgba(233, 30, 99, 0.35); }
            50% { transform: scale(1.03); box-shadow: 0 6px 25px rgba(233, 30, 99, 0.5); }
        }

        .class-signature {
            margin-top: 22px;
            text-align: center;
            color: #C2185B;
            font-size: 13px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* 底部装饰丝带 */
        .ribbon-bottom {
            text-align: center;
            margin-top: 25px;
        }

        .ribbon-bottom::before {
            content: "❃ ❂ ❁ ❀ ❀";
            font-size: 14px;
            color: #E91E63;
            letter-spacing: 8px;
            opacity: 0.4;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .header h1 { font-size: 26px; }
            .blessing-card { padding: 30px 20px 22px; width: 95%; }
            .blessing-text { font-size: 15px; }
            .photo-hint { font-size: 13px; padding: 8px 18px; }
        }

        /* 加载动画 */
        .photo-card {
            opacity: 0;
            transform: translateY(30px);
        }

        .photo-card.loaded {
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- 花瓣容器 -->
    <div id="petalsContainer"></div>

    <div class="container">
        <!-- 顶部装饰 -->
        <div class="ribbon-top"></div>

        <!-- 标题区 -->
        <div class="header">
            <div class="flower-deco">🌸</div>
            <h1>母亲节快乐</h1>
            <div class="subtitle">把爱说给妈妈听</div>
            <div class="date-badge">✿ 2026.05.10 ✿</div>
        </div>

        <!-- 合照区 -->
        <div class="photo-section">
            <div class="photo-card" id="photoCard">
                <!-- 角花装饰 -->
                <div class="corner-deco tl">❀</div>
                <div class="corner-deco tr">❀</div>
                <div class="corner-deco bl">❀</div>
                <div class="corner-deco br">❀</div>

                <div class="photo-wrapper">
                    <img src="photo.jpg" alt="班级合照" id="classPhoto">
                    <div class="photo-hint">👆 点击照片，收获一份惊喜</div>
                </div>
            </div>
        </div>

        <!-- 底部区域 -->
        <div class="footer">
            <div class="teacher-message">
                <h3>💌 寄语</h3>
                <p>
                    同学们，感谢你们愿意把对妈妈的爱，写成文字。<br><br>
                    这里有你们说出口的，也有你们平时藏在心里的。<br><br>
                    今天，就让这些话，替你们飞进妈妈心里。<br><br>
                    母亲节快乐，也祝天下所有妈妈，永远被温柔以待。
                </p>
            </div>

            <div class="share-section">
                <div class="share-hint">📱 打开链接后，截图即可分享给妈妈</div>
            </div>

            <div class="class-signature">
                23物流2班 全体同学 敬上
            </div>

            <div class="ribbon-bottom"></div>
        </div>
    </div>

    <!-- 祝福弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="blessing-card">
            <div class="card-top-deco">
                <span class="envelope">💌</span>
            </div>
            <div class="card-title">来自同学的心里话</div>
            <div class="blessing-text" id="blessingText"></div>
            <div class="button-group">
                <button class="btn btn-primary" id="nextBtn">💫 换一条</button>
                <button class="btn btn-secondary" id="closeBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════
        // 祝福语数据（在这里修改祝福内容）
        // ═══════════════════════════════════════
        const blessings = [
            "你是100分的妈妈！",
            "妈妈，谢谢你一直在背后默默支持我，支持我很多奇奇怪怪的决定，get到我很多行为后面的意思，虽然你不善言辞，默默付出，但是总能让我感觉到满满的爱，我爱你呀妈妈",
            "如果爱有方向，您就是那个坐标。无论我走多远，一回头，您总在那里。您的碎碎念念，温暖了我的岁岁年年。愿时光慢一些，让我能伴您左右，就像小时候您耐心陪我长大一样。",
            "是女性，是母亲，也是强大独立的你自己，你先是自己，然后才是母亲，节日快乐！",
            "希望妈妈永远健康快乐！",
            "妈妈，我爱你"
        ];

        // DOM 元素
        const photoCard     = document.getElementById('photoCard');
        const modalOverlay  = document.getElementById('modalOverlay');
        const blessingText  = document.getElementById('blessingText');
        const nextBtn       = document.getElementById('nextBtn');
        const closeBtn      = document.getElementById('closeBtn');
        const petalsContainer = document.getElementById('petalsContainer');

        let currentIndex = -1;
        let isTyping = false;
        let typingTimer = null;

        // ═══════════════════════════════════════
        // 花瓣飘落效果
        // ═══════════════════════════════════════
        const petalChars = ['❀', '🌸', '🌺', '💕', '✿', '❁'];

        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.textContent = petalChars[Math.floor(Math.random() * petalChars.length)];
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = (8 + Math.random() * 10) + 'px';
            petal.style.animationDuration = (8 + Math.random() * 8) + 's';
            petal.style.animationDelay = Math.random() * 5 + 's';
            petal.style.animationName = 'fall';
            petal.style.animationTimingFunction = 'ease-in-out';
            petal.style.animationIterationCount = 'infinite';
            petalsContainer.appendChild(petal);

            // 清理完成动画的元素
            setTimeout(() => {
                if (petal.parentNode) petal.remove();
            }, 16000);
        }

        // 定时生成花瓣
        setInterval(createPetal, 800);
        // 初始生成一些花瓣
        for (let i = 0; i < 6; i++) {
            setTimeout(createPetal, i * 300);
        }

        // ═══════════════════════════════════════
        // 获取随机索引（避免连续重复）
        // ═══════════════════════════════════════
        function getRandomIndex() {
            if (blessings.length <= 1) return 0;
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * blessings.length);
            } while (newIndex === currentIndex);
            return newIndex;
        }

        // ═══════════════════════════════════════
        // 打字机效果
        // ═══════════════════════════════════════
        function typeWriter(text, element, speed = 60) {
            // 清除之前的打字
            if (typingTimer) {
                clearTimeout(typingTimer);
                typingTimer = null;
            }

            isTyping = true;
            element.textContent = '';
            element.classList.add('typing');

            let i = 0;

            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    typingTimer = setTimeout(type, speed);
                } else {
                    element.classList.remove('typing');
                    isTyping = false;
                }
            }

            type();
        }

        // ═══════════════════════════════════════
        // 显示祝福
        // ═══════════════════════════════════════
        function showBlessing() {
            currentIndex = getRandomIndex();
            const text = blessings[currentIndex];
            typeWriter(text, blessingText, 55);
        }

        // ═══════════════════════════════════════
        // 打开/关闭弹窗
        // ═══════════════════════════════════════
        function openModal() {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            showBlessing();
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            blessingText.classList.remove('typing');
            isTyping = false;
            if (typingTimer) {
                clearTimeout(typingTimer);
                typingTimer = null;
            }
        }

        // ═══════════════════════════════════════
        // 事件监听
        // ═══════════════════════════════════════
        photoCard.addEventListener('click', openModal);

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isTyping) showBlessing();
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // ═══════════════════════════════════════
        // 页面加载动画
        // ═══════════════════════════════════════
        window.addEventListener('load', () => {
            setTimeout(() => {
                photoCard.classList.add('loaded');
            }, 100);
        });
    </script>
</body>
</html>
